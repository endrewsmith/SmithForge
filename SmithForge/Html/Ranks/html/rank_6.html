<div class="message rank-6-container platform-{platform}"
     data-message-number="{messageNumber}"
     data-message-id="{messageId}"
     data-user-id="{userId}"
     data-user-rank="{userRank}">
    <!-- БЛОК АВАТАРА И ИМЕНИ (Двухколоночный Grid) -->
    <div class="msg-top-grid">
        <!-- Левая колонка: Аватарка 24x24px с контуром и заглушкой -->
        <div class="avatar-border-v5">
            <img class="user-avatar-v5" src="{avatarPath}" alt=""
                 onerror="this.style.display='none'; this.parentElement.classList.add('empty');" />
        </div>

        <!-- Правая колонка: Ранг, карма и имя -->
        <div class="msg-meta-block">
            <!-- Верхняя полоска (Ранг и Карма) -->
            <div class="msg-header-line">
                <span class="rank-display">{rankDisplay}</span>
                <div class="karma-container">
                    <span class="karma-key">{karmaKey}</span>
                    <span class="karma-value">{karma}</span>
                    <span class="karma-icon">⚡</span>
                </div>
            </div>
            <!-- Нижняя полоска (Имя пользователя) -->
            <div class="name-block">
                <span class="name">{displayName}</span>
            </div>
        </div>
    </div>

    <!-- ТЕКСТ СООБЩЕНИЯ -->
    <div class="msg-body-v5">
        <span class="text">{formattedMessage}</span>
    </div>

    <!-- НИЖНЯЯ ОБЛАСТЬ (Статистика и реакции) -->
    <div class="msg-footer">
        <div class="msg-number-container">
            <span class="hash-symbol">#</span>
            <span class="msg-number">{messageNumber}</span>
        </div>
        <div class="reactions-container">
            <!-- ✅ СКРЫТЫ через hidden -->
            <div class="reaction-panel like-panel hidden">
                <span class="reaction-icon like-icon">👍</span>
                <span class="reaction-count like-count">{likes}</span>
            </div>
            <div class="reaction-panel dislike-panel hidden">
                <span class="reaction-icon dislike-icon">👎</span>
                <span class="reaction-count dislike-count">{dislikes}</span>
            </div>
        </div>
    </div>
</div>
