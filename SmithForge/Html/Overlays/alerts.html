<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SmithForge Alerts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* ============================================================
           БЛОК АЛЕРТОВ (ДОНАТЫ) — плашка 800×120 сверху
           ============================================================ */
        #alert-container {
            position: fixed;
            top: 0;
            left: 50%;
            width: 800px;
            max-width: 100vw;
            height: 120px;
            transform: translateX(-50%) translateY(-100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

            #alert-container.visible {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            #alert-container.hiding {
                opacity: 0;
                transform: translateX(-50%) translateY(-40%);
            }

        .alert-box {
            width: 100%;
            height: 100%;
            padding: 10px 26px 10px 26px;
            border-radius: 0 0 16px 16px;
            border: 2px solid;
            border-top: none;
            backdrop-filter: blur(10px);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

            .alert-box.provider-donationalerts {
                background: rgba(13, 13, 26, 0.92);
                border-color: #FFD700;
                box-shadow: 0 6px 40px rgba(255, 215, 0, 0.5), 0 0 80px rgba(255, 215, 0, 0.25);
            }

                .alert-box.provider-donationalerts .provider-label,
                .alert-box.provider-donationalerts .user-name {
                    color: #FFD700;
                }

            .alert-box.provider-donationpay {
                background: rgba(13, 26, 46, 0.92);
                border-color: #00BFFF;
                box-shadow: 0 6px 40px rgba(0, 191, 255, 0.5), 0 0 80px rgba(0, 191, 255, 0.25);
            }

                .alert-box.provider-donationpay .provider-label,
                .alert-box.provider-donationpay .user-name {
                    color: #00BFFF;
                }

        .provider-label {
            font-size: 8px;
            opacity: 0.7;
            margin-bottom: 2px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .row-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .user-name {
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 20px currentColor;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 380px;
        }

        .separator {
            color: #555;
            font-size: 22px;
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
            white-space: nowrap;
        }

        .message {
            font-size: 18px;
            color: #E8E8E8;
            line-height: 1.2;
            max-width: 740px;
            margin: 0 auto 2px auto;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

            .message:empty {
                display: none;
            }

        /* Благодарность по сумме доната */
        .thank-you {
            font-size: 12px;
            font-weight: 600;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.3);
            letter-spacing: 0.5px;
            margin-top: 1px;
            display: none;
            animation: thankYouPulse 2s ease-in-out infinite;
        }

            .thank-you.visible {
                display: block;
            }

        @keyframes thankYouPulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* ============================================================
           БЛОК СТАТИСТИКИ — плашка 800×130 сверху
           ============================================================ */
        #stats-block {
            position: fixed;
            top: 0;
            left: 50%;
            width: 800px;
            max-width: 100vw;
            height: 130px;
            padding: 8px 14px 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: transparent;
            border-top: none;
            border-radius: 0 0 16px 16px;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateX(-50%) translateY(-100%);
            transition: opacity 1.5s ease, transform 1.5s ease;
            pointer-events: none;
        }

            #stats-block.visible {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

        .stats-title {
            flex: 0 0 auto;
            font-size: 15px;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 0.4px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats-list {
            flex: 1 1 auto;
            display: flex;
            flex-direction: row;
            gap: 8px;
            min-height: 0;
        }

        .stats-card {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: rgba(40, 40, 55, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

            .stats-card .avatar {
                flex: 0 0 auto;
                width: 48px;
                height: 48px;
                border-radius: 8px;
                object-fit: cover;
                background: #333;
            }

            .stats-card .info {
                flex: 1 1 auto;
                min-width: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 2px;
            }

            .stats-card .name {
                font-size: 14px;
                font-weight: 600;
                color: #fff;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                line-height: 1.1;
            }

            .stats-card .value {
                font-size: 13px;
                font-weight: 500;
                color: #FFD700;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                line-height: 1.1;
            }

            .stats-card.rank-1 {
                border-color: rgba(255, 215, 0, 0.55);
                box-shadow: 0 0 12px rgba(255, 215, 0, 0.25) inset;
            }

                .stats-card.rank-1 .name {
                    color: #FFD700;
                }

            .stats-card.rank-2 {
                border-color: rgba(192, 192, 192, 0.45);
            }

                .stats-card.rank-2 .name {
                    color: #C0C0C0;
                }

            .stats-card.rank-3 {
                border-color: rgba(205, 127, 50, 0.45);
            }

                .stats-card.rank-3 .name {
                    color: #CD7F32;
                }
    </style>
</head>
<body>

    <!-- ============================================================
         ОВЕРЛЕЙ ДОНАТОВ
         ============================================================ -->
    <div id="alert-container">
        <div class="alert-box" id="alert-box">
            <div class="provider-label" id="provider-label"></div>
            <div class="row-main">
                <span class="user-name" id="user-name"></span>
                <span class="separator">•</span>
                <span class="amount" id="amount"></span>
            </div>
            <div class="message" id="message"></div>
            <div class="thank-you" id="thank-you"></div>
        </div>
    </div>

    <!-- ============================================================
         ОВЕРЛЕЙ СТАТИСТИКИ (РОТАЦИЯ ТОПОВ)
         ============================================================ -->
    <div id="stats-block">
        <div class="stats-title" id="stats-title"></div>
        <div class="stats-list" id="stats-list"></div>
    </div>

    <script>
        // ============================================================
        // ОВЕРЛЕЙ ДОНАТОВ
        // ============================================================
        const alertContainer = document.getElementById('alert-container');
        const alertBox = document.getElementById('alert-box');
        const providerLabel = document.getElementById('provider-label');
        const userNameEl = document.getElementById('user-name');
        const amountEl = document.getElementById('amount');
        const messageEl = document.getElementById('message');
        const thankYouEl = document.getElementById('thank-you');

        let es = null;
        let queue = [];
        let isShowing = false;
        let isShowingAlert = false;

        let hideTimer = null;
        let hidingEndTimer = null;
        let nextAlertTimer = null;

        const MAX_QUEUE = 20;

        // ✅ Возвращает текст благодарности по сумме доната
        function getThankYouText(alert) {
        let amount = 0;
        if (alert.displayAmount) {
        const match = alert.displayAmount.match(/[\d.,]+/);
        if (match) {
        amount = parseFloat(match[0].replace(',', '.'));
        }
        }

        if (!amount || amount <= 0) return '';

        if (amount >= 1000) return '👑 Легендарная поддержка! Спасибо!';
        if (amount >= 500)  return '🔥 Огромное спасибо за поддержку!';
        if (amount >= 100)  return '💛 Большое спасибо за поддержку!';
        return '💛 Спасибо за поддержку!';
        }

        function connect() {
        if (es) {
        es.close();
        es = null;
        }

        es = new EventSource('/alerts/stream');

        es.onmessage = function (e) {
        try {
        const data = JSON.parse(e.data);

        if (data.type === 'alert') {
        addToQueue(data.alert);
        }
        } catch (err) {
        console.error('Parse error:', err);
        }
        };

        es.onerror = function () {
        if (es && es.readyState === EventSource.CLOSED) {
        console.log('Alerts SSE закрыт — переподключение не требуется');
        return;
        }

        setTimeout(connect, 3000);
        };

        es.onopen = function () {
        console.log('✅ Alerts SSE подключён');
        };
        }

        function addToQueue(alert) {
        if (queue.length >= MAX_QUEUE) {
        queue.shift();
        console.warn('⚠️ Очередь алертов переполнена — старый удалён');
        }

        queue.push(alert);
        console.log('🔔 Добавлен алерт в очередь:', alert.userName, 'Осталось:', queue.length);

        if (!isShowing) {
        showNext();
        }
        }

        function clearAllTimers() {
        if (hideTimer) {
        clearTimeout(hideTimer);
        hideTimer = null;
        }
        if (hidingEndTimer) {
        clearTimeout(hidingEndTimer);
        hidingEndTimer = null;
        }
        if (nextAlertTimer) {
        clearTimeout(nextAlertTimer);
        nextAlertTimer = null;
        }
        }

        function showNext() {
        if (queue.length === 0) {
        isShowing = false;
        return;
        }

        isShowing = true;
        isShowingAlert = true;

        hideStatsImmediate();

        const alert = queue.shift();

        const providerClass = 'provider-' + (alert.providerType || 'donationalerts').toLowerCase();

        alertBox.className = 'alert-box ' + providerClass;
        providerLabel.textContent = alert.providerName || 'ALERT';

        userNameEl.textContent = alert.userName || 'Аноним';
        amountEl.textContent = alert.displayAmount || '';

        if (alert.message && alert.message.trim()) {
        messageEl.textContent = alert.message;
        messageEl.style.display = 'block';
        } else {
        messageEl.textContent = '';
        messageEl.style.display = 'none';
        }

        // ✅ Показ/скрытие благодарности по сумме
        const thanksText = getThankYouText(alert);
        if (thanksText) {
        thankYouEl.textContent = thanksText;
        thankYouEl.classList.add('visible');
        } else {
        thankYouEl.textContent = '';
        thankYouEl.classList.remove('visible');
        }

        alertContainer.className = 'visible';

        const duration = (alert.durationSeconds || 10) * 1000;

        clearAllTimers();

        hideTimer = setTimeout(() => {
        hideTimer = null;

        alertContainer.className = 'hiding';

        hidingEndTimer = setTimeout(() => {
        hidingEndTimer = null;

        alertContainer.className = '';

        nextAlertTimer = setTimeout(() => {
        nextAlertTimer = null;

        isShowingAlert = false;

        if (statsPending) {
        const pending = statsPending;
        statsPending = null;
        renderStats(pending);
        }

        showNext();
        }, 400);
        }, 350);
        }, duration);
        }

        connect();
        console.log('🎉 SmithForge Alerts Overlay запущен');

        // ============================================================
        // ОВЕРЛЕЙ СТАТИСТИКИ (РОТАЦИЯ ТОПОВ)
        // ============================================================
        const statsBlock = document.getElementById('stats-block');
        const statsTitle = document.getElementById('stats-title');
        const statsList = document.getElementById('stats-list');

        let statsSource = null;
        let statsHideTimer = null;
        let statsPending = null;

        function clearStatsHideTimer() {
        if (statsHideTimer) {
        clearTimeout(statsHideTimer);
        statsHideTimer = null;
        }
        }

        function showStats(data) {
        if (!data || !Array.isArray(data.entries) || data.entries.length === 0) {
        return;
        }

        if (isShowingAlert) {
        statsPending = data;
        console.log('[Stats] отложена, идёт донат');
        return;
        }

        renderStats(data);
        }

        function renderStats(data) {
        statsTitle.textContent = data.title || '';
        statsList.innerHTML = '';

        data.entries.forEach(e => {
        const card = document.createElement('div');
        card.className = 'stats-card rank-' + e.rank;

        if (e.avatarUrl) {
        const img = document.createElement('img');
        img.className = 'avatar';
        img.src = e.avatarUrl;
        img.alt = '';
        img.onerror = function () { this.style.visibility = 'hidden'; };
        card.appendChild(img);
        } else {
        const stub = document.createElement('div');
        stub.className = 'avatar';
        card.appendChild(stub);
        }

        const info = document.createElement('div');
        info.className = 'info';

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = e.displayName || '';
        info.appendChild(name);

        const value = document.createElement('span');
        value.className = 'value';
        value.textContent = e.valueText || '';
        info.appendChild(value);

        card.appendChild(info);

        statsList.appendChild(card);
        });

        statsBlock.classList.add('visible');

        const duration = (data.duration || 15) * 1000;
        clearStatsHideTimer();
        statsHideTimer = setTimeout(() => {
        statsHideTimer = null;
        statsBlock.classList.remove('visible');
        }, duration + 500);
        }

        function hideStats() {
        clearStatsHideTimer();
        statsBlock.classList.remove('visible');
        }

        function hideStatsImmediate() {
        clearStatsHideTimer();
        statsBlock.classList.remove('visible');
        }

        function connectStats() {
        if (statsSource) {
        statsSource.close();
        statsSource = null;
        }

        statsSource = new EventSource('/stats/stream');

        statsSource.onopen = function () {
        console.log('✅ Stats SSE подключён');
        };

        statsSource.onmessage = function (e) {
        try {
        const payload = JSON.parse(e.data);
        if (payload.type === 'stats_show') {
        showStats(payload);
        } else if (payload.type === 'stats_hide') {
        hideStats();
        }
        } catch (err) {
        console.warn('[Stats] parse error', err);
        }
        };

        statsSource.onerror = function () {
        if (statsSource && statsSource.readyState === EventSource.CLOSED) {
        console.log('Stats SSE закрыт — переподключение не требуется');
        return;
        }

        setTimeout(connectStats, 3000);
        };
        }

        connectStats();
        console.log('📊 Stats Rotation Overlay запущен');

        // ============================================================
        // ЗАКРЫТИЕ СТРАНИЦЫ
        // ============================================================
        window.addEventListener('beforeunload', function () {
        if (es) {
        es.close();
        es = null;
        console.log('Alerts SSE соединение принудительно закрыто перед обновлением.');
        }

        if (statsSource) {
        statsSource.close();
        statsSource = null;
        console.log('Stats SSE соединение принудительно закрыто перед обновлением.');
        }

        clearAllTimers();
        clearStatsHideTimer();
        });
    </script>
</body>
</html>
