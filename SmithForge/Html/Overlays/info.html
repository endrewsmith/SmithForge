    <script>
        // ============================================================
// ИНИЦИАЛИЗАЦИЯ ПАКОВ: включаем скролл, если паков > 20
// ============================================================

function setupPacksGrid(grid) {
    const cards = grid.querySelectorAll('.pack-card');
    const count = cards.length;

    if (grid.dataset.packsInit === '1') return;
    grid.dataset.packsInit = '1';

    console.log(`[Packs] setupPacksGrid. Cards: ${count}, Threshold: ${STICKER_AUTO_THRESHOLD}`);

    if (count > STICKER_AUTO_THRESHOLD) {
        // Много паков → вертикальный скролл и автопрокрутка
        grid.classList.add('packs-scrollable');
        stickerGridAutoStart(grid);   // та же функция — работает и с packs
    } else {
        // Мало паков → обычная сетка
        grid.classList.remove('packs-scrollable');
    }
}
// ============================================================
// ABOUT-КОМАНДЫ: отдельный порог автопрокрута
// ============================================================
const COMMANDS_AUTO_THRESHOLD = 2;

function setupCommandsGrid(grid) {
    const cards = grid.querySelectorAll('.pack-card');
    const count = cards.length;

    if (grid.dataset.cmdInit === '1') return;
    grid.dataset.cmdInit = '1';

    console.log(`[Commands] setupCommandsGrid. Cards: ${count}, Threshold: ${COMMANDS_AUTO_THRESHOLD}`);

    if (count > COMMANDS_AUTO_THRESHOLD) {
        grid.classList.add('packs-scrollable');   // ← тот же класс, что у паков
        stickerGridAutoStart(grid);                // ← та же функция автопрокрута
    } else {
        grid.classList.remove('packs-scrollable');
    }
}
       // ============================================================
// АВТОПРОКРУТКА СТИКЕРОВ (горизонтальная) — только если их > 20
// ============================================================

const STICKER_PAUSE_MS = 4000;
const STICKER_SCROLL_MS = 1200;
const STICKER_AUTO_THRESHOLD = 20;

const stickerScrollStates = new WeakMap();

function animateScrollLeft(grid, target, duration, onComplete) {
    const start = grid.scrollLeft;
    const distance = target - start;
    const startTime = performance.now();

    function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function step(now) {
        const state = stickerScrollStates.get(grid);
        if (state && state.stopped) return;

        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1);
        const eased = easeInOut(t);

        grid.scrollTo({ left: start + distance * eased, behavior: 'auto' });

        if (t < 1) {
            requestAnimationFrame(step);
        } else if (onComplete) {
            onComplete();
        }
    }

    requestAnimationFrame(step);
}

// Ширина одной колонки (карточка + gap)
function getStickerColumnStep(grid) {
    // Ищем карточку — либо стикер, либо пак
    const card = grid.querySelector('.sticker-card, .pack-card');
    if (!card) return 76;
    const rect = card.getBoundingClientRect();
    const gap = 4;
    return rect.width + gap;
}

function stickerAutoLoop(grid) {
    const state = stickerScrollStates.get(grid);
    if (!state || state.stopped) return;

    const maxScroll = grid.scrollWidth - grid.clientWidth;
    const current = grid.scrollLeft;
    const step = getStickerColumnStep(grid);

    // ✅ Дошли до правого края — меняем направление на "влево"
    if (state.direction === 1 && current >= maxScroll - 2) {
        state.direction = -1;
    }
    // ✅ Дошли до левого края — меняем направление на "вправо"
    else if (state.direction === -1 && current <= 2) {
        state.direction = 1;
    }

    // ✅ Целевая позиция — учитывая направление
    let target = current + state.direction * step;

    // Ограничиваем границами
    if (target > maxScroll) target = maxScroll;
    if (target < 0) target = 0;

    animateScrollLeft(grid, target, STICKER_SCROLL_MS, () => {
        const s = stickerScrollStates.get(grid);
        if (!s || s.stopped) return;
        if (s.stopping) {
            stickerScrollStates.delete(grid);
            return;
        }
        s.timeoutId = setTimeout(() => stickerAutoLoop(grid), STICKER_PAUSE_MS);
    });
}

function stickerGridAutoStart(grid) {
    if (stickerScrollStates.has(grid)) return;
    if (grid.scrollWidth <= grid.clientWidth + 2) return;

    const state = {
        stopped: false,
        stopping: false,
        timeoutId: null,
        direction: 1,                 // ✅ 1 = вправо, -1 = влево
        firstDelayDone: false
    };
    stickerScrollStates.set(grid, state);

    grid.addEventListener('mouseenter', () => stickerGridAutoStop(grid));
    grid.addEventListener('mouseleave', () => stickerGridAutoResume(grid));

    // ✅ Первый сдвиг — с задержкой, чтобы сообщение успело встать
    const FIRST_DELAY_MS = 14000;
    state.timeoutId = setTimeout(() => {
        const s = stickerScrollStates.get(grid);
        if (!s || s.stopped) return;
        s.firstDelayDone = true;
        stickerAutoLoop(grid);
    }, FIRST_DELAY_MS);
}

function stickerGridAutoStop(grid) {
    const state = stickerScrollStates.get(grid);
    if (!state) return;
    state.stopping = true;
    if (state.timeoutId) {
        clearTimeout(state.timeoutId);
        state.timeoutId = null;
    }
}

function stickerGridAutoStopImmediate(grid) {
    const state = stickerScrollStates.get(grid);
    if (!state) return;
    state.stopped = true;
    if (state.timeoutId) {
        clearTimeout(state.timeoutId);
        state.timeoutId = null;
    }
    stickerScrollStates.delete(grid);
}

function stickerGridAutoResume(grid) {
    const state = stickerScrollStates.get(grid);
    if (!state) return;
    state.stopping = false;
    state.stopped = false;
    if (!state.timeoutId) {
        stickerAutoLoop(grid);
    }
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ: включаем скролл, если стикеров > 20
// ============================================================

function setupStickerGrid(grid) {
    const cards = grid.querySelectorAll('.sticker-card');
    const count = cards.length;

    if (grid.dataset.stickerInit === '1') return;
    grid.dataset.stickerInit = '1';

    console.log(`[Sticker] setupStickerGrid. Cards: ${count}, Threshold: ${STICKER_AUTO_THRESHOLD}`);

    if (count > STICKER_AUTO_THRESHOLD) {
        // Много → включаем горизонтальный скролл и автопрокрутку
        grid.classList.add('sticker-scrollable');
        stickerGridAutoStart(grid);
    } else {
        // Мало → обычная сетка без скролла
        grid.classList.remove('sticker-scrollable');
    }
}

        const chatContainer = document.getElementById('chat-container');

        // ============================================================

        let es = null;

        // ============================================================
        // НАСТРОЙКИ
        // ============================================================
        const MAX_MESSAGES = 10;

        let currentScrollSpeed = 1500;
        let currentAppearSpeed = 0.3;

        // ============================================================
        // РАСПОРКА (spacer)
        // ============================================================
        function initSpacer() {
        const spacer = document.createElement('div');
        spacer.className = 'chat-spacer';

        }
        initSpacer();

        // ============================================================
        // СКРОЛЛ
        // ============================================================
        let scrollAnimationFrameId = null;

        function smoothScrollToBottomAsync(element, duration) {
        return new Promise((resolve) => {
        if (scrollAnimationFrameId) {
        cancelAnimationFrame(scrollAnimationFrameId);
        }

        const start = element.scrollTop;
        let startTime = null;

        function animateScroll(currentTime) {
        if (!startTime) startTime = currentTime;
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = progress * (2 - progress);

        const target = element.scrollHeight - element.clientHeight;
        const change = target - start;

        if (change > 0) {
        element.scrollTop = start + change * ease;
        }

        if (elapsed < duration) {
        scrollAnimationFrameId = requestAnimationFrame(animateScroll);
        } else {
        element.scrollTop = element.scrollHeight - element.clientHeight;
        scrollAnimationFrameId = null;
        resolve();
        }
        }

        scrollAnimationFrameId = requestAnimationFrame(animateScroll);
        });
        }

        // ============================================================
        // ЖДЁМ АНИМАЦИЮ ПОЯВЛЕНИЯ
        // ============================================================
        function waitForAnimation(element) {
        return new Promise((resolve) => {
        let done = false;

        const finish = () => {
        if (done) return;
        done = true;
        element.removeEventListener('animationend', onEnd);
        element.removeEventListener('animationcancel', onEnd);
        resolve();
        };

        const onEnd = () => finish();

        element.addEventListener('animationend', onEnd);
        element.addEventListener('animationcancel', onEnd);

        setTimeout(finish, (currentAppearSpeed * 1000) + 300);
        });
        }

        // ============================================================
// ЖДЁМ ИМЕННО slideUp (не любую анимацию)
// ============================================================
function waitForSlideUp(element, durationMs) {
    return new Promise((resolve) => {
        let done = false;

        const finish = () => {
            if (done) return;
            done = true;
            element.removeEventListener('animationend', onEnd);
            resolve();
        };

        const onEnd = (e) => {
            // Реагируем ТОЛЬКО на slideUp
            if (e.animationName === 'slideUp') {
                finish();
            }
        };

        element.addEventListener('animationend', onEnd);

        // Fallback — на случай, если animationend не сработал
        setTimeout(finish, durationMs + 300);
    });
}

        // ============================================================
        // УДАЛЕНИЕ СООБЩЕНИЙ
        // ============================================================
        function removeMessages(messages) {
        return new Promise((resolve) => {
        if (messages.length === 0) {
        resolve();
        return;
        }

        let pending = messages.length;

        for (const oldMsg of messages) {
oldMsg.querySelectorAll('.sticker-grid, .packs-grid, .commands-grid').forEach(grid => {
    stickerGridAutoStopImmediate(grid);
});
        oldMsg.classList.add('message-leaving');

        let done = false;
        const finish = () => {
        if (done) return;
        done = true;

        if (oldMsg.parentNode) oldMsg.remove();
        pending--;
        if (pending === 0) resolve();
        };

        oldMsg.addEventListener('transitionend', (e) => {
        if (e.propertyName === 'opacity' || e.propertyName === 'max-height') {
        finish();
        }
        });

        setTimeout(finish, 600);
        }
        });
        }

        // ============================================================
        // ОЧЕРЕДЬ (главное исправление)
        // ============================================================
        const revealQueue = [];
        let isProcessingQueue = false;

        function revealAndScrollMessage(msgDiv) {
        revealQueue.push(msgDiv);

        if (!isProcessingQueue) {
        processNextInQueue();
        }
        }

async function processNextInQueue() {
    if (revealQueue.length === 0) {
        isProcessingQueue = false;
        return;
    }

    isProcessingQueue = true;
    const msgDiv = revealQueue.shift();

    console.log(`[InfoQueue] Старт. В очереди: ${revealQueue.length}`);

    try {
        // 1. Удаляем старые, если нужно
        const activeMessages = Array.from(chatContainer.children).filter(el =>
            !el.classList.contains('chat-spacer') &&
            !el.classList.contains('message-leaving')
        );

        const slotsNeeded = activeMessages.length + 1 - MAX_MESSAGES;

        if (slotsNeeded > 0) {
            await removeMessages(activeMessages.slice(0, slotsNeeded));
        }

        // 2. Останавливаем все карусели
// 2. Останавливаем все карусели
document.querySelectorAll('.sticker-grid, .packs-grid, .commands-grid').forEach(grid => {
    stickerGridAutoStop(grid);
});
        await new Promise(resolve => setTimeout(resolve, STICKER_SCROLL_MS + 100));

        // 3. Добавляем в DOM с opacity: 0
        msgDiv.style.opacity = '0';
        msgDiv.style.animation = 'none';
        chatContainer.appendChild(msgDiv);
        void msgDiv.offsetHeight;

        // 4. Запускаем анимацию появления
        msgDiv.style.animation = `slideUp ${currentAppearSpeed}s ease-out forwards`;

        // ✅ ЖЁСТКО ЖДЁМ ДЛИТЕЛЬНОСТЬ АНИМАЦИИ + ЗАПАС
        //    Никаких animationend — просто таймер
        const appearMs = currentAppearSpeed * 1000;
        await new Promise(resolve => setTimeout(resolve, appearMs + 2000));

        // 5. ТОЛЬКО ТЕПЕРЬ запускаем стикеры
msgDiv.querySelectorAll('.sticker-grid').forEach(grid => {
    setupStickerGrid(grid);
});

// ✅ Обрабатываем и главную страницу паков
msgDiv.querySelectorAll('.packs-grid').forEach(grid => {
    setupPacksGrid(grid);
});

        // ✅ Обрабатываем about-страницу с командами
msgDiv.querySelectorAll('.commands-grid').forEach(grid => {
    setupCommandsGrid(grid);
});

        // 6. Скролл info-чата вниз
        const msgHeight = msgDiv.offsetHeight || 200;
        const minSpeed = Math.max(currentScrollSpeed * 0.8, 600);
        const maxSpeed = Math.min(currentScrollSpeed * 6.0, 10000);
        const heightFactor = Math.min(Math.max((msgHeight - 30) / 600, 0), 1);
        const scrollDuration = minSpeed + (maxSpeed - minSpeed) * heightFactor;

        await smoothScrollToBottomAsync(chatContainer, scrollDuration);

        console.log(`[InfoQueue] ✅ Цикл завершён`);
    } catch (ex) {
        console.error(`[InfoQueue] Ошибка:`, ex);
    }

    processNextInQueue();
}

        

        // ============================================================
        // ОБНОВЛЕНИЕ СКОРОСТЕЙ ИЗ SSE
        // ============================================================
        function updateScrollSpeed(speed) {
        currentScrollSpeed = speed;
        console.log(`🏃 Скорость скролла обновлена: ${speed}ms`);
        }

        function updateAppearSpeed(speed) {
        currentAppearSpeed = speed;
        console.log(`✨ Скорость появления обновлена: ${speed}s`);
        }

        // ============================================================
        // ДОБАВЛЕНИЕ СООБЩЕНИЯ
        // ============================================================
        function addMessage(pageName, html) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';

        msgDiv.innerHTML = `<div class="msg-body">${html}</div>`;

        // FALLBACK: если в HTML нет .page-commands — генерируем из имени файла
        const pageRoot = msgDiv.querySelector('.page-root');
        if (pageRoot && !pageRoot.querySelector('.page-commands')) {
        const cmdDiv = document.createElement('div');
        cmdDiv.className = 'page-commands';
        cmdDiv.textContent = `!!info:${(pageName || 'help').replace(/\//g, ':')}`;
        pageRoot.insertBefore(cmdDiv, pageRoot.firstChild);
        }

        // Ждём загрузки картинок
        const images = msgDiv.querySelectorAll('img');

        if (images.length === 0) {
        revealAndScrollMessage(msgDiv);
        } else {
        const promises = Array.from(images).map(img => {
        if (img.complete && img.naturalWidth > 0) {
        return Promise.resolve();
        }

        return new Promise((resolve) => {
        const timeout = setTimeout(() => {
        img.onload = null;
        img.onerror = null;
        resolve();
        }, 3000);

        function handler() {
        clearTimeout(timeout);
        img.onload = null;
        img.onerror = null;
        resolve();
        }
        img.onload = handler;
        img.onerror = handler;
        });
        });

        Promise.allSettled(promises).then(() => {
        revealAndScrollMessage(msgDiv);
        });
        }
        }

        // ============================================================
        // SSE ПОДКЛЮЧЕНИЕ
        // ============================================================
        function connectInfoStream() {
        if (es) {
        es.close();
        es = null;
        }
        es = new EventSource('/info/stream');

        es.onmessage = function(e) {
        try {
        const data = JSON.parse(e.data);

        if (data.type === 'info_message') {
        addMessage(data.pageName, data.html);
        }

        if (data.type === 'scroll_speed') {
        updateScrollSpeed(data.speed);
        }

        if (data.type === 'appear_speed') {
        updateAppearSpeed(data.speed);
        }
        } catch (ex) {
        console.error('SSE error:', ex);
        }
        };

        es.onerror = function() {
        if (es && es.readyState === EventSource.CLOSED) {
        console.log('Info SSE закрыт — переподключение не требуется');
        return;
        }

        console.warn('SSE ошибка. Браузер попробует переподключиться автоматически.');
        };
        }

        // ============================================================
        // СТАРТ
        // ============================================================
        connectInfoStream();
        console.log('📚 Информационный чат для OBS запущен! Жду команды...');
        console.log(`🏃 Скорость скролла: ${currentScrollSpeed}ms`);
        console.log(`✨ Скорость появления: ${currentAppearSpeed}s`);

        window.addEventListener('beforeunload', () => {
        if (es) {
        es.close();
        es = null;
        console.log('Info SSE соединение принудительно закрыто перед обновлением.');
        }
        });
    </script>
