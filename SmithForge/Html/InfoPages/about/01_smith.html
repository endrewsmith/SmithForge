<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .abprof-page * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .abprof-page {
            font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
            color: #c8c8cd;
            padding: 0px 6px 0px 2px;
            width: 100%;
        }

        .abprof-page .abprof-section {
            margin-bottom: 14px;
        }

        .abprof-page .abprof-section-title {
            display: block;
            width: 100%;
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: #dcdce1;
            background: rgba(255, 255, 255, 0.08);
            border-left: 4px solid rgba(255, 255, 255, 0.55);
            padding: 8px 10px;
            margin-bottom: 8px;
            border-radius: 2px;
        }

        .abprof-page .abprof-text {
            font-size: 24px;
            line-height: 1.3;
            color: #b8b8be;
            padding-left: 2px;
        }

        .abprof-page .abprof-text b {
            color: #d2d2d7;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="abprof-page">

        <div class="abprof-section">
            <div class="abprof-section-title">Смит</div>
            <div class="abprof-text">
                Легенда ретро гейминга
            </div>
        </div>

    </div>

</body>
</html>
